<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Media - zazeza67</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Galeri Media zazeza67</h1>
    <!-- Baris Navigasi / Kembali -->
    <div id="nav-bar" class="nav-bar" style="display: none;">
      <button id="back-btn" class="back-btn">← Kembali ke Daftar Folder</button>
      <h2 id="current-folder-title"></h2>
    </div>
  </header>

  <main>
    <!-- Tampilan Utama: Grid Folder -->
    <div id="folders-grid" class="folders-grid"></div>

    <!-- Tampilan Detail: Grid Media dalam Folder -->
    <div id="media-grid" class="media-grid" style="display: none;"></div>
  </main>

  <!-- Modal Lightbox untuk Zoom & View -->
  <div id="lightbox" class="lightbox">
    <span class="close-btn" onclick="closeLightbox()">&times;</span>
    <div class="lightbox-content">
      <div id="lightbox-media-wrapper"></div>
      <div class="lightbox-controls">
        <button id="zoom-in-btn">+ Zoom In</button>
        <button id="zoom-out-btn">- Zoom Out</button>
        <button id="reset-zoom-btn">Reset Zoom</button>
        <a id="download-btn" href="" download target="_blank" class="dl-btn">Download File</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
