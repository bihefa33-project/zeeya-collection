<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Media - zeeya-collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Galeri Media zeeya-collection</h1>
    <!-- Baris Navigasi / Kembali -->
    <div id="nav-bar" class="nav-bar" style="display: none;">
      <button id="back-btn" class="back-btn">← Kembali ke Daftar Folder</button>
      <h2 id="current-folder-title"></h2>
    </div>
  </header>

  <main>
    <!-- Tampilan Utama: Grid Folder -->
    <div id="folders-grid" class="folders-grid"></div>

    <!-- Tampilan Detail: Grid Media dalam Folder -->
    <div id="media-grid" class="media-grid" style="display: none;"></div>
  </main>

 <!-- LIGHTBOX / PREVIEW MODAL -->
<div id="lightbox" class="lightbox">
  <span class="close-btn" onclick="closeLightbox()">&times;</span>
  
  <div class="lightbox-content">
    <div id="lightbox-media-wrapper"></div>
    
    <!-- HANYA TOMBOL DOWNLOAD MELAYANG -->
    <div class="lightbox-controls">
      <a id="download-btn" href="#" download class="dl-btn">Download File</a>
    </div>
  </div>
</div>
